services:
  postgres:
    image: postgres:17-alpine3.21
    restart: "no"
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db
    ports:
      - '5432:5432'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d app_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
